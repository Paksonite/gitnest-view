name: GitNestView
options:
  bundleIdPrefix: pl.paksonite
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    DEAD_CODE_STRIPPING: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  GitNestView:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources
    dependencies:
      - package: Sparkle
    settings:
      configs:
        # A development build next to the installed app: its own identity,
        # so tests and scripts never touch (or quit) the copy in use.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: pl.paksonite.gitnest-view.debug
      base:
        PRODUCT_NAME: GitNest View
        PRODUCT_MODULE_NAME: GitNestView
        PRODUCT_BUNDLE_IDENTIFIER: pl.paksonite.gitnest-view
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/GitNestView.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Build gitnest-core
        script: |
          "$SRCROOT/scripts/build-core.sh" "$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Helpers/gitnest-core"
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - GitNestViewTests
  GitNestViewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: GitNestView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.paksonite.gitnest-view.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GitNest View.app/Contents/MacOS/GitNest View"
  GitNestViewUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: GitNestView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.paksonite.gitnest-view.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        TEST_TARGET_NAME: GitNestView
# Clicks through the real app; takes over the pointer, so it is its own
# scheme and not part of scripts/test.sh (see scripts/ui-test.sh).
schemes:
  GitNestViewUI:
    build:
      targets:
        GitNestView: all
        GitNestViewUITests: [test]
    test:
      config: Debug
      targets:
        - GitNestViewUITests
